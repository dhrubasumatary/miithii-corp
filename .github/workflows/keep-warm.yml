# Keeps the free-tier engine from spinning down (Render sleeps after 15 min).
name: keep-warm
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -sS --max-time 90 https://miithii-engine.onrender.com/health && echo
